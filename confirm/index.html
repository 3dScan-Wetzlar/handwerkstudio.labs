<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Eintragung bestätigen</title>
<style>
:root{
 --accent:hsl(215,62%,38%); --accent-ink:hsl(215,62%,29%);
 --accent-soft:hsl(215,48%,96%); --accent-line:hsl(215,40%,86%);
 --bg:#f6f8fb; --surface:#ffffff; --text:#18222e; --muted:#5c6b7a; --border:#e3e8ef;
 --radius:12px;
 --sp-2:8px; --sp-3:16px; --sp-4:24px; --sp-5:40px; --sp-6:64px;
 --fs-0:.85rem; --fs-1:1rem; --fs-2:1.14rem; --fs-3:1.4rem; --fs-4:2.05rem;
}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;
 background:var(--bg);color:var(--text);line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:var(--sp-5) 20px}
h1{font-size:var(--fs-4);line-height:1.15;letter-spacing:-.02em;margin:.2em 0 .35em}
h2{font-size:var(--fs-3);line-height:1.3;margin:1.5em 0 .5em}
p{margin:.7em 0}
a{color:var(--accent-ink)}
li{margin:10px 0;line-height:1.55}
.hero{background:linear-gradient(180deg,var(--accent-soft),var(--bg));
 border-bottom:1px solid var(--border)}
.hero .wrap{padding-top:var(--sp-6);padding-bottom:var(--sp-5)}
.sub{color:var(--muted);font-size:var(--fs-2);max-width:58ch}
.badge{display:inline-block;background:var(--surface);color:var(--accent-ink);
 border:1px solid var(--accent-line);border-radius:999px;padding:3px 12px;
 font-size:var(--fs-0);font-weight:600;letter-spacing:.02em}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;
 border-radius:8px;padding:13px 26px;font-size:var(--fs-1);font-weight:600;
 cursor:pointer;text-decoration:none;margin-top:var(--sp-3)}
.btn:hover{background:var(--accent-ink)}
.btn-ghost{display:inline-block;background:transparent;color:var(--accent-ink);
 border:1px solid var(--accent-line);border-radius:8px;padding:12px 22px;
 font-size:var(--fs-1);cursor:pointer;text-decoration:none}
.hero-fine{color:var(--muted);font-size:var(--fs-0);margin-top:var(--sp-2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
 padding:var(--sp-4);margin-top:var(--sp-4);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.center{text-align:center}
label{display:block;margin:12px 0 4px;font-weight:600}
input[type=email],input[type=text]{width:100%;padding:11px;border:1px solid var(--border);
 border-radius:8px;font-size:var(--fs-1);background:var(--surface)}
input[type=email]:focus,input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
.radio{font-weight:400;margin:6px 0}
.radio label{display:inline;font-weight:400;margin:0}
.price-anchor{font-size:var(--fs-4);font-weight:700;letter-spacing:-.02em;margin:.1em 0}
.price-anchor small{font-size:var(--fs-1);font-weight:400;color:var(--muted)}
.trust{list-style:none;padding:0;margin:var(--sp-4) 0 0;display:flex;flex-wrap:wrap;gap:10px}
.trust li{background:var(--surface);border:1px solid var(--border);border-radius:8px;
 padding:8px 14px;font-size:var(--fs-0);color:var(--muted);margin:0}
.faq dt{font-weight:600;margin-top:var(--sp-3)}
.faq dd{margin:4px 0 0;color:var(--muted)}
.intro{color:#33424f;font-size:var(--fs-2)}
.cta{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);
 border-radius:var(--radius);padding:var(--sp-3) var(--sp-4);margin-top:var(--sp-5)}
.cta a{color:var(--accent-ink);font-weight:600}
a.home{color:var(--muted);font-size:.9em;text-decoration:none}
.fine{color:var(--muted);font-size:var(--fs-0);margin-top:var(--sp-4);
 border-top:1px solid var(--border);padding-top:12px}
.wrap{text-align:center;max-width:640px}
</style></head><body><div class="wrap"><div class="card">
<form name="waitlist-confirm" method="POST" action="/confirm/" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="waitlist-confirm">
  <input type="hidden" name="t" value="">
</form>
<h1 id="msg">Bestätigung läuft &hellip;</h1>
<noscript><p>Bitte öffne diesen Link mit aktiviertem JavaScript, um die Eintragung zu bestätigen.</p></noscript>
</div>
<p class="fine">Double-Opt-in-Bestätigung eines Software-Experiments (FounderOS). Es werden keine
weiteren Daten erhoben; der Link enthält nur ein anonymes Token.</p>
</div>
<script>
(function(){
  var t = new URLSearchParams(location.search).get("t") || "";
  var msg = document.getElementById("msg");
  if(!/^[0-9a-f]{16,64}$/.test(t)){ msg.textContent = "Ungültiger oder fehlender Bestätigungslink."; return; }
  fetch("/", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
              body:"form-name=waitlist-confirm&t="+encodeURIComponent(t)})
    .then(function(r){ msg.textContent = r.ok ? "Danke — deine Eintragung ist bestätigt."
                                              : "Bestätigung fehlgeschlagen. Bitte später erneut versuchen."; })
    .catch(function(){ msg.textContent = "Netzwerkfehler — bitte später erneut versuchen."; });
})();
</script>
</body></html>
